[package]
name = "camouflage"
version = "0.1.0"
description = "Configuration app for Camouflage hand tracking"
authors = ["Noah"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
keyring = "3"
tokio = { version = "1", features = ["full"] }
dirs = "5"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSError"] }
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation", "CLLocationManagerDelegate"] }
